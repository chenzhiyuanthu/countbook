name: Countbook
options:
  bundleIdPrefix: com.czy
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: "493WT6Z4J4"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_STRICT_CONCURRENCY: minimal
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ALWAYS_SEARCH_USER_PATHS: NO
    CLANG_ENABLE_MODULES: YES

targets:
  Countbook:
    type: application
    platform: iOS
    sources:
      - path: Countbook
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.czy.countbook
        PRODUCT_NAME: Countbook
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: Countbook/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
  CountbookTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CountbookTests
    dependencies:
      - target: Countbook
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.czy.countbook.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Countbook:
    build:
      targets:
        Countbook: all
        CountbookTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CountbookTests
